				const bruit = document.getElementById('grain-bruit');
				const horloge = {t: 0};
				tl.fromTo(horloge, {t: 0}, {t: 40.267, duration: 40.267, ease: 'none', onUpdate: () => bruit.setAttribute('seed', 1 + (Math.floor(horloge.t * 12) % 97))}, 0);

				window.__timelines['main'] = tl;
