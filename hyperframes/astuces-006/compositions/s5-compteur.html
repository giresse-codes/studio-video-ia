					<div data-hf-id="hf-iyzb" class="objets">

	<script>
		(function () {
			const S = kit.scene('s5');
			const tl = S.tl;

			// « Ensemble » : le compteur ; son disque tourne et les chiffres montent jusqu'à la fin.
			kit.pop(tl, '#s5-compteur', 0);
			tl.fromTo('#s5-disque', {scaleX: 1, svgOrigin: '440 590'}, {scaleX: -1, duration: 0.3, ease: 'none', yoyo: true, repeat: Math.floor(S.dur / 0.3)}, 0.2);
			const chiffres = document.querySelector('#s5-chiffres');
			const n = {v: 1};
			tl.fromTo(n, {v: 1}, {v: 99999, duration: S.dur, ease: 'power2.in', onUpdate: () => (chiffres.textContent = String(Math.round(n.v)).padStart(5, '0'))}, 0);
			// « vingt-quatre heures » : l'étiquette (zoom) ; « année » : le calendrier qui s'effeuille.
			kit.tampon(tl, '#s5-24', S.ancre('@heures'));
			S.zoomMot('@heures', [330, 560]);
			const annee = S.ancre('@annee');
			kit.pop(tl, '#s5-calendrier', S.ancre('@toute'));
			const jour = document.querySelector('#s5-jour');
			const j = {v: 1};
			tl.fromTo(j, {v: 1}, {v: 365, duration: 0.9, ease: 'power1.in', onUpdate: () => (jour.textContent = Math.round(j.v))}, annee);
			tl.to('#s5-24', {opacity: 0, duration: 0.15}, annee - 0.15);
			kit.pop(tl, '#s5-annee', annee);

			S.fin();
		})();
	</script>
