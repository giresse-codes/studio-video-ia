	<script>
		(function () {
			const S = kit.scene('s4');
			const tl = S.tl;
			const encore = S.ancre('@encore');

			// L'eau monte dans la porte : elle atteint le bouton sur « encore ».
			tl.fromTo('#s4-eau', {y: 0}, {y: -270, duration: encore, ease: 'none'}, 0);
			tl.to('#s4-eau', {y: -330, duration: S.dur - encore, ease: 'none'}, encore);

			// « deux » : la carte de la règle 2 ; « ouvre » : la vitre descend.
			kit.pop(tl, '#s4-carte', S.ancre('@deux'));
			tl.to('#s4-vitre', {y: 300, duration: 0.6, ease: 'power2.inOut'}, S.ancre('@ouvre'));
			// « électriques » : le bouton s'allume ; « encore » : l'eau le noie, il s'éteint.
			tl.fromTo('#s4-bouton', {scale: 1, svgOrigin: '300 1060'}, {scale: 1.2, duration: 0.18, ease: 'power2.out', yoyo: true, repeat: 1}, S.ancre('@electriques'));
			tl.to('#s4-eclair', {fill: '#5C6680', duration: 0.08, yoyo: true, repeat: 3}, encore);
			tl.set('#s4-eclair', {fill: '#5C6680'}, encore + 0.4);

			// « sinon » : la vitre reste fermée ; « brise-vitre » : l'outil ; « coin » : on frappe le coin, la vitre se fissure.
			tl.to('#s4-vitre', {y: 0, duration: 0.3, ease: 'power2.out'}, S.ancre('@sinon'));
			kit.pop(tl, '#s4-outil', S.ancre('@brisevitre'));
			const coin = S.ancre('@coin');
			tl.to('#s4-outil', {x: 60, y: -190, rotation: -30, duration: 0.15, ease: 'power3.in'}, coin - 0.15);
			tl.to('#s4-outil', {x: 90, y: -60, rotation: 0, duration: 0.35, ease: 'power2.out'}, coin + 0.05);
			kit.trace(tl, '.s4-fissure', coin, 0.25, 'power3.out');
			S.zoomMot('@coin', [700, 760]);

			// « jamais » : la porte recule ; « pare-brise » : il apparaît en orange ; « pas » : croix rouge, il ne casse pas.
			const jamais = S.ancre('@jamais');
			tl.to('#s4-porte', {scale: 0.55, svgOrigin: '110 570', opacity: 0.55, duration: 0.4, ease: 'power2.inOut'}, jamais);
			kit.pop(tl, '#s4-avant', jamais + 0.1);
			tl.to('#s4-parebrise', {fill: '#FF8A3D', duration: 0.2, yoyo: true, repeat: 3}, S.ancre('@parebrise'));
			kit.trace(tl, '.s4-croix', S.ancre('@pas'), 0.3);
			kit.tampon(tl, '#s4-pas', S.ancre('@pas'));

			S.fin();
