				tl.fromTo(horloge, {t: 0}, {t: 42.362, duration: 42.362, ease: 'none', onUpdate: () => bruit.setAttribute('seed', 1 + (Math.floor(horloge.t * 12) % 97))}, 0);

				window.__timelines['main'] = tl;
