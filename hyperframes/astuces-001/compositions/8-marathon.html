		(function () {
			const K = 7;
			const tl = gsap.timeline({paused: true});
			const {dur} = kit.scene(K);
			const stage = document.getElementById('s8-stage');
			const at = (prefix, f, nth) => kit.word(K, prefix, f, nth);

			kit.enterExit(tl, stage, dur, {from: 'right'});
			kit.parallax(tl, stage, dur, {bg: 30, mid: 20, fg: 60, zoom: 1.05});
			document.querySelectorAll('.s8-row').forEach((row, i) => kit.loop(tl, row, {y: -14}, i * 0.15, dur, 0.5 + i * 0.1));

			// « même pas un petit match » : la manette tombe, puis une croix rouge se dessine.

			kit.draw(tl, '.s8-x', at('match', 0.24) - 0.1, 0.3, 'power2.out');
			tl.to('#s8-pad', {x: -380, rotation: -30, opacity: 0, transformOrigin: '50% 50%', duration: 0.45, ease: 'power3.in'}, at('on', 0.39) - 0.2);

			// Le coureur entre en charge, dossard 42, sandwich à la main ; la piste défile.
			const run = at('on', 0.39);
			tl.fromTo('#s8-runner', {x: 700}, {x: 0, duration: 0.6, ease: 'power3.out'}, run);
			tl.fromTo('#s8-cable', {opacity: 0}, {opacity: 1, duration: 0.2}, run + 0.3);
			const strides = Math.max(1, Math.floor((dur - run) / 0.3));
			tl.fromTo('#s8-leg-a', {rotation: -28, svgOrigin: '390 880'}, {rotation: 28, duration: 0.15, ease: 'sine.inOut', yoyo: true, repeat: strides * 2 - 1}, run);
			tl.fromTo('#s8-leg-b', {rotation: 28, svgOrigin: '450 880'}, {rotation: -28, duration: 0.15, ease: 'sine.inOut', yoyo: true, repeat: strides * 2 - 1}, run);
			tl.fromTo('#s8-arm-a', {rotation: 20, svgOrigin: '335 700'}, {rotation: -20, duration: 0.15, ease: 'sine.inOut', yoyo: true, repeat: strides * 2 - 1}, run);
			kit.loop(tl, '#s8-runner', {y: -16}, run + 0.6, dur, 0.3);
			tl.fromTo('.s8-dash', {x: 0}, {x: -250, duration: 0.4, ease: 'none', repeat: Math.max(0, Math.floor((dur - run) / 0.4) - 1)}, run);
			tl.fromTo('#s8-cones', {x: 0}, {x: -1700, duration: dur - run, ease: 'none'}, run);

			// Banderole « MARATHON » sur le mot.
			const mara = at('marathon', 0.55);
			kit.drop(tl, '#s8-banner', mara - 0.15, {height: 400});
			kit.drop(tl, '#s8-banner-text', mara - 0.15, {height: 400});

			// « manger » : il croque le sandwich (une bouchée apparaît).
			const bite = at('manger', 0.82);
			tl.to('#s8-arm-b', {rotation: -35, svgOrigin: '505 700', duration: 0.2, ease: 'power2.out', yoyo: true, repeat: 1}, bite - 0.2);
			tl.fromTo('#s8-bite', {attr: {r: 0}}, {attr: {r: 26}, duration: 0.12, ease: 'power2.out'}, bite);
			tl.to('#s8-sandwich', {scaleX: 1.15, scaleY: 0.85, transformOrigin: '50% 50%', duration: 0.08, yoyo: true, repeat: 1}, bite);

			window.__timelines['s8'] = tl;
		})();
