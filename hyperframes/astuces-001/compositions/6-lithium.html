	<style>
		#root {
			position: absolute;

		#s6-pct {
			position: absolute;
			left: 180px;
			top: 455px;
			width: 520px;

		#s6-label {
			left: 300px;

		}
		#s6-tile-text {
			position: absolute;
			left: 780px;
			top: 170px;
			width: 190px;
			text-align: center;
			font-family: Poppins;
			font-weight: 800;
			color: #1a1a1a;
		}
	</style>
	<div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
		<div class="stage" id="s6-stage">
			<div class="cam">
				<!-- Fond : étagère de laboratoire, case « Li » du tableau périodique. -->
				<div class="bg">
					<svg class="layer" viewBox="0 0 1080 1920">
						<rect x="60" y="300" width="400" height="24" rx="10" fill="#8C6957" />
						<rect x="90" y="200" width="60" height="100" rx="14" fill="#7CC8F0" opacity="0.7" />
						<path d="M 200 300 L 230 220 L 230 180 L 270 180 L 270 220 L 300 300 Z" fill="#9FD3A8" opacity="0.8" />
						<rect x="340" y="230" width="70" height="70" rx="12" fill="#F2B33D" opacity="0.7" />
						<g id="s6-tile">
							<rect x="780" y="160" width="190" height="210" rx="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" />
						</g>
					</svg>
					<div id="s6-tile-text">
						<div style="font-size: 48px; text-align: left; padding-left: 20px; padding-top: 6px">3</div>
						<div style="font-size: 110px; line-height: 1; margin-top: -10px">Li</div>
					</div>
				</div>
				<!-- Objets : la batterie, sa capacité perdue, la flamme de chaleur. -->
				<div class="mid">
					<svg class="layer" viewBox="0 0 1080 1920">
						<defs>
							<filter id="s6-soft" x="-30%" y="-30%" width="160%" height="160%">
								<feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#3C1E14" flood-opacity="0.25" />
							</filter>
							<pattern id="s6-worn" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
								<rect width="28" height="28" fill="#D7CFC9" />
								<rect width="12" height="28" fill="#F08A4B" opacity="0.6" />
							</pattern>
						</defs>
						<g id="s6-battery">
							<g filter="url(#s6-soft)">
								<rect x="160" y="400" width="560" height="280" rx="54" fill="#BFC5CC" />
								<rect x="720" y="490" width="44" height="100" rx="16" fill="#BFC5CC" />
							</g>
							<rect x="182" y="422" width="516" height="236" rx="38" fill="url(#s6-worn)" />
							<rect id="s6-fill" x="182" y="422" width="516" height="236" rx="38" fill="#7CC8F0" />
						</g>
						<g transform="translate(110 620)"><g id="s6-flame">
							<path d="M 0 60 Q -60 0 -10 -70 Q 0 -20 30 -40 Q 70 20 0 60 Z" fill="#F08A4B" />
							<path d="M 0 50 Q -25 20 0 -15 Q 25 20 0 50 Z" fill="#F2B33D" />
						</g></g>
						<path id="s6-down" d="M 860 420 L 860 640" stroke="#E5383B" stroke-width="18" stroke-linecap="round" fill="none" />
						<path id="s6-down-head" d="M 830 610 L 860 660 L 890 610 Z" fill="#E5383B" />
					</svg>
					<div id="s6-pct">100 %</div>
					<div id="s6-label" class="label">lithium</div>
				</div>
				<!-- Premier plan : fiole floue. -->
				<div class="fg">
					<svg class="layer" viewBox="0 0 1080 1920">
						<path d="M 960 1120 L 1000 980 L 1000 900 L 1060 900 L 1060 980 L 1100 1120 Z" fill="#7CC8F0" opacity="0.8" />
					</svg>
				</div>
			</div>
		</div>
	</div>
	<script>
		(function () {
			const K = 5;
			const tl = gsap.timeline({paused: true});
			const {dur} = kit.scene(K);
			const stage = document.getElementById('s6-stage');
			const at = (prefix, f, nth) => kit.word(K, prefix, f, nth);

			kit.enterExit(tl, stage, dur, {from: 'right'});
			kit.parallax(tl, stage, dur, {bg: 20, mid: 40, fg: 140, zoom: 1.06});

			kit.pop(tl, '#s6-battery', 0.05);
			tl.fromTo('#s6-pct', {opacity: 0, scale: 0.5}, {opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2.4)'}, 0.2);

			// La chaleur s'approche de la batterie (« chaleur »).
			tl.fromTo('#s6-flame', {x: -200, opacity: 0}, {x: 0, opacity: 1, duration: 0.5, ease: 'back.out(2)'}, at('chaleur', 0.05));
			kit.loop(tl, '#s6-flame', {scaleY: 1.15, transformOrigin: '50% 100%'}, at('chaleur', 0.05) + 0.5, dur, 0.4);

			// Case « Li » et étiquette sur « lithium ».
			const li = at('lithium', 0.33);
			tl.fromTo('#s6-tile, #s6-tile-text', {scaleX: 0, opacity: 0, transformOrigin: '50% 50%'}, {scaleX: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)'}, li - 0.2);
			kit.stamp(tl, '#s6-label', li);

			// Chaque « plus » : la batterie chauffe, sursaute, perd un cran de capacité.
			const steps = [
				[at('plus', 0.48, 0), 92],
				[at('plus', 0.66, 1), 86],
				[at('capacite', 0.78), 80],
			];
			const counter = {v: 100};
			const pct = document.getElementById('s6-pct');
			let prev = 100;
			steps.forEach(([t, value]) => {
				// Seule la première étape pose son état de départ à la construction ; sinon la dernière l'emporterait.
				tl.fromTo(counter, {v: prev}, {v: value, duration: 0.5, ease: 'power2.out', immediateRender: prev === 100, onUpdate: () => (pct.textContent = `${Math.round(counter.v)} %`)}, t);
				tl.to('#s6-fill', {scaleX: value / 100, transformOrigin: '0% 50%', fill: '#F08A4B', duration: 0.5, ease: 'power2.out'}, t);
				tl.to('#s6-fill', {fill: '#7CC8F0', duration: 0.4}, t + 0.6);
				tl.to('#s6-battery', {scaleX: 0.94, scaleY: 1.06, transformOrigin: '50% 100%', duration: 0.1, yoyo: true, repeat: 1}, t);
				prev = value;
			});
			kit.draw(tl, '#s6-down', steps[2][0], 0.4, 'power2.out');
			tl.fromTo('#s6-down-head', {opacity: 0, scale: 0, transformOrigin: '50% 0%'}, {opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)'}, steps[2][0] + 0.35);

			window.__timelines['s6'] = tl;
		})();
	</script>
</template>
