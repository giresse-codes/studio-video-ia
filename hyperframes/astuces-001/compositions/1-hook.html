	<script>
		(function () {
			const K = 0;
			const tl = gsap.timeline({paused: true});
			const {dur} = kit.scene(K);
			const stage = document.getElementById('s1-stage');
			const at = (prefix, f, nth) => kit.word(K, prefix, f, nth);

			kit.enterExit(tl, stage, dur, {from: 'none'});
			kit.parallax(tl, stage, dur, {bg: 16, mid: 36, fg: 90, zoom: 1.07});

			// Nuit vivante : étoiles qui scintillent, lueur du téléphone, couette qui respire.
			document.querySelectorAll('.s1-star').forEach((star, i) => kit.loop(tl, star, {opacity: 0.25}, 0.2 + i * 0.37, dur, 1.4 + i * 0.2));
			kit.loop(tl, '#s1-glow', {opacity: 0.85, scaleX: 1.15, transformOrigin: '50% 50%'}, 0, dur, 1.2);
			kit.loop(tl, '#s1-duvet', {scaleY: 1.025, transformOrigin: '50% 100%'}, 0, dur, 2.4);

			// Zzz en cascade.
			kit.rise(tl, '.s1-zz', 0.3, dur, {dy: -120, cycle: 1.8});

			// Titre mot par mot, avec rebond, sur « lit ».
			const lit = at('lit', 0.18);
			tl.fromTo('#s1-title span', {opacity: 0, y: -80, scaleY: 1.3}, {opacity: 1, y: 0, scaleY: 1, duration: 0.45, ease: 'bounce.out', stagger: 0.12}, lit - 0.3);

			// Thermomètre : monte toute la scène, sursaute sur « Arrête ».
			tl.fromTo('#s1-mercury', {scaleY: 0.25, transformOrigin: '50% 100%'}, {scaleY: 0.6, duration: dur, ease: 'none'}, 0);
			const stop = at('arrete', 0.26);
			tl.fromTo('#s1-thermo', {scaleX: 1, scaleY: 1, transformOrigin: '50% 100%'}, {scaleX: 0.85, scaleY: 1.15, duration: 0.12, ease: 'power2.out', yoyo: true, repeat: 1}, stop);
			tl.fromTo('#s1-burst', {opacity: 0, scale: 0.5, transformOrigin: '50% 100%'}, {opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(3)'}, stop);
			tl.to('#s1-burst', {opacity: 0, duration: 0.3}, stop + 0.9);
			tl.to('#s1-mercury', {fill: '#E5383B', duration: 0.3}, stop);

			// Gag : un chat sort de sous la couette sur « chat », puis le téléphone pointe le bout de l'écran.
			const cat = at('chat', 0.6);
			tl.fromTo('#s1-cat', {y: 230}, {y: 0, duration: 0.5, ease: 'back.out(2)'}, cat - 0.2);
			tl.to('#s1-cat', {rotation: -6, transformOrigin: '50% 100%', duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 3}, cat + 0.3);
			const sleep = at('dormir', 0.75);
			tl.fromTo('#s1-phone', {y: 170}, {y: 0, duration: 0.55, ease: 'back.out(2.2)'}, sleep - 0.25);
			tl.to('#s1-phone', {scaleX: 1.08, scaleY: 0.92, transformOrigin: '50% 100%', duration: 0.1, yoyo: true, repeat: 1}, sleep + 0.3);

			window.__timelines['s1'] = tl;
