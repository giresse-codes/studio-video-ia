	<script>
		(function () {
			const K = 2;
			const tl = gsap.timeline({paused: true});
			const {dur} = kit.scene(K);
			const stage = document.getElementById('s3-stage');
			const at = (prefix, f, nth) => kit.word(K, prefix, f, nth);

			kit.enterExit(tl, stage, dur, {from: 'right'});
			kit.parallax(tl, stage, dur, {bg: 18, mid: 40, fg: 120, zoom: 1.08, dir: -1});

			// Pointeuse : les aiguilles tournent à toute vitesse (heures sup).
			tl.fromTo('#s3-min', {rotation: 0, svgOrigin: '0 0'}, {rotation: 360 * 6, duration: dur, ease: 'none'}, 0);
			tl.fromTo('#s3-hour', {rotation: 0, svgOrigin: '0 0'}, {rotation: 180, duration: dur, ease: 'none'}, 0);
			tl.fromTo('#s3-tape', {x: -500}, {x: 0, duration: 0.5, ease: 'expo.out'}, 0.1);

			// Le chargeur arrive, il est fatigué ; le casque tombe sur « chargeur ».
			kit.pop(tl, '#s3-charger', 0.05);
			kit.drop(tl, '#s3-hat', at('chargeur', 0.12) + 0.05, {height: 420});
			tl.to('#s3-charger', {scaleX: 1.06, scaleY: 0.94, transformOrigin: '50% 100%', duration: 0.1, yoyo: true, repeat: 1}, at('chargeur', 0.12) + 0.43);

			// Badge « heures sup ».
			kit.stamp(tl, '#s3-badge', at('heures', 0.4));

			// Sueur, vapeur et coup de bras sur le front sur « transpire ».
			const sweat = at('transpire', 0.65);
			kit.rise(tl, '.s3-drop', sweat - 0.3, dur, {dy: 140, cycle: 0.9});
			kit.rise(tl, '.s3-puff', 0.6, dur, {dy: -160, cycle: 1.4});
			tl.fromTo('#s3-arm', {rotation: 0, svgOrigin: '590 640'}, {rotation: -55, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 3}, sweat);
			kit.loop(tl, '#s3-face', {y: 6}, 0.6, dur, 0.5);

			window.__timelines['s3'] = tl;
		})();
	</script>
