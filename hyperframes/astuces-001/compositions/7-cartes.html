	<script>
		(function () {
			const K = 6;
			const tl = gsap.timeline({paused: true});
			const {dur} = kit.scene(K);
			const stage = document.getElementById('s7-stage');
			const at = (prefix, f, nth) => kit.word(K, prefix, f, nth);

			kit.enterExit(tl, stage, dur, {from: 'down'});
			kit.parallax(tl, stage, dur, {bg: 16, mid: 30, fg: 120, zoom: 1.04});

			// « trois gestes » : titre qui rebondit mot par mot.
			tl.fromTo('#s7-title span', {opacity: 0, y: -90}, {opacity: 1, y: 0, duration: 0.5, ease: 'bounce.out', stagger: 0.15}, at('trois', 0.07) - 0.1);

			// Une carte par geste, quand il est annoncé, avec son chiffre qui rebondit et son pictogramme.
			const cards = [
				['#s7-c1', at('une', 0.18)],
				['#s7-c2', at('deux', 0.49)],
				['#s7-c3', at('trois', 0.76, 1)],
			];
			cards.forEach(([card, t]) => {
				tl.fromTo(card, {opacity: 0, x: -160, rotation: -4}, {opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: 'back.out(1.8)'}, t - 0.1);
				kit.pop(tl, `${card} .s7-num`, t + 0.1);
			});
			kit.cascade(tl, '.s7-i1', at('surface', 0.28), 0.1);
			kit.loop(tl, '.s7-i1', {y: -6}, at('surface', 0.28) + 0.5, dur, 0.6);
			tl.to('#s7-case', {x: 50, y: -20, rotation: 25, opacity: 0, transformOrigin: '50% 50%', duration: 0.6, ease: 'back.in(1.6)'}, at('coque', 0.58));
			kit.draw(tl, '.s7-x', at('jeu', 0.87), 0.25, 'power2.out');

			window.__timelines['s7'] = tl;
		})();
