				<!-- Premier plan : la loupe qui ouvre la coupe, un tournevis flou. -->

	<script>
		(function () {
			const K = 1;
			const tl = gsap.timeline({paused: true});
			const {dur} = kit.scene(K);
			const stage = document.getElementById('s2-stage');
			const at = (prefix, f, nth) => kit.word(K, prefix, f, nth);

			kit.enterExit(tl, stage, dur, {from: 'none'});
			kit.parallax(tl, stage, dur, {bg: 24, mid: 50, fg: 140, zoom: 1.05});

			// Plongée à travers la loupe : elle grossit jusqu'à sortir du cadre et révèle la coupe.
			tl.fromTo('#s2-lens', {scale: 0.35, opacity: 1, transformOrigin: '470px 560px'}, {scale: 3.4, duration: 0.7, ease: 'power3.in'}, 0);
			tl.to('#s2-lens', {opacity: 0, duration: 0.2}, 0.55);
			tl.fromTo('#s2-phone, #s2-battery', {opacity: 0, scale: 0.8, transformOrigin: '470px 560px'}, {opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.8)'}, 0.25);
			kit.drop(tl, '#s2-charger', 1.1, {height: 260});
			tl.fromTo('#s2-cable', {opacity: 0}, {opacity: 1, duration: 0.01}, 1.3);
			kit.draw(tl, '#s2-cable', 1.3, 0.5);
			kit.loop(tl, '#s2-gear-a', {rotation: 40, transformOrigin: '960px 230px'}, 0, dur, 3);
			kit.loop(tl, '#s2-gear-b', {rotation: -40, transformOrigin: '110px 1090px'}, 0, dur, 3.4);

			// Le courant : flèche dorée qui se dessine, électrons qui suivent le câble.
			const courant = at('courant', 0.2);
			kit.draw(tl, '#s2-current', courant, 1.2);
			tl.fromTo('#s2-current-head', {opacity: 0, scale: 0, transformOrigin: '470px 700px'}, {opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(3)'}, courant + 1.15);
			const path = document.getElementById('s2-current');
			const len = path.getTotalLength();
			document.querySelectorAll('.s2-e').forEach((dot, i) => {
				const start = courant + 0.4 + i * 0.35;
				const travel = {p: 0};
				const cycles = Math.max(1, Math.floor((dur - start - 0.4) / 1.2));
				tl.fromTo(dot, {opacity: 0}, {opacity: 1, duration: 0.15}, start);
				tl.fromTo(
					travel,
					{p: 0},
					{
						p: 1,
						duration: 1.2,
						ease: 'none',
						repeat: cycles - 1,
						onUpdate: () => {
							const pt = path.getPointAtLength(travel.p * len);
							dot.setAttribute('cx', pt.x);
							dot.setAttribute('cy', pt.y);
						},
					},
					start,
				);
			});

			// La batterie se remplit sur « batterie ».
			const full = at('batterie', 0.33) + 0.3;
			tl.fromTo('#s2-charge', {scaleY: 0.1, transformOrigin: '50% 100%'}, {scaleY: 1, duration: 0.8, ease: 'back.out(1.6)'}, full);
			tl.to('#s2-battery', {scaleX: 1.08, scaleY: 0.94, transformOrigin: '50% 100%', duration: 0.1, yoyo: true, repeat: 1}, full + 0.8);

			// Pertes : une flèche rouge et une étiquette par partie, quand elle est nommée.
			const parts = [
				['cable', at('cable', 0.5)],
				['charger', at('chargeur', 0.57)],
				['battery', at('batterie', 0.66, 1)],
			];
			parts.forEach(([name, t]) => {
				kit.draw(tl, `#s2-leak-${name}`, t, 0.35, 'power2.out');
				tl.fromTo(`#s2-head-${name}`, {opacity: 0}, {opacity: 1, duration: 0.1}, t + 0.3);
				kit.pop(tl, `#s2-l-${name}`, t);
			});

			// Chaleur : halos orange qui pulsent, puis l'étiquette tamponnée.
			const perdue = at('perdue', 0.82);
			tl.fromTo('.s2-glow', {opacity: 0, scale: 0.6, transformOrigin: '50% 50%'}, {opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out', stagger: 0.12}, perdue);
			kit.loop(tl, '.s2-glow', {scale: 1.12}, perdue + 0.6, dur, 0.9);
			kit.stamp(tl, '#s2-l-heat', at('chaleur', 0.91));

			// Caméra : petits recadrages vers chaque partie nommée.
			tl.to('#s2-cam', {x: 30, y: -40, duration: 0.6, ease: 'power2.inOut'}, parts[0][1] - 0.2);
			tl.to('#s2-cam', {x: 30, y: 50, duration: 0.6, ease: 'power2.inOut'}, parts[1][1] - 0.2);
			tl.to('#s2-cam', {x: -30, y: 40, duration: 0.6, ease: 'power2.inOut'}, parts[2][1] - 0.2);
			tl.to('#s2-cam', {x: 0, y: 0, duration: 0.8, ease: 'power2.inOut'}, perdue);

			window.__timelines['s2'] = tl;
		})();
	</script>
