	<script>
		(function () {
			const K = 3;
			const tl = gsap.timeline({paused: true});
			const {dur} = kit.scene(K);
			const stage = document.getElementById('s4-stage');
			const at = (prefix, f, nth) => kit.word(K, prefix, f, nth);

			kit.enterExit(tl, stage, dur, {from: 'right'});
			kit.parallax(tl, stage, dur, {bg: 14, mid: 34, fg: 120, zoom: 1.05});
			kit.loop(tl, '#s4-sun', {scale: 1.12, transformOrigin: '50% 50%'}, 0, dur, 1.2);

			// La table glisse, le téléphone s'y pose avec un petit écrasement.
			tl.fromTo('#s4-table', {y: 80, opacity: 0}, {y: 0, opacity: 1, duration: 0.4, ease: 'power3.out'}, 0.05);
			kit.drop(tl, '#s4-phone', 0.25, {height: 240});

			// Chaleur : vagues orange qui montent et se dissipent ; « l'air » : volutes bleues.
			kit.rise(tl, '.s4-wave', at('chaleur', 0.35) - 0.2, dur, {dy: -380, cycle: 1.3});
			kit.cascade(tl, '.s4-air', at('air', 0.7) - 0.1, 0.12);
			tl.to('.s4-air', {rotation: 25, transformOrigin: '50% 50%', duration: 0.6, ease: 'sine.inOut'}, at('air', 0.7) + 0.3);

			window.__timelines['s4'] = tl;
		})();
