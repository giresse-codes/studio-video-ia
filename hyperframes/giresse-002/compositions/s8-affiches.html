<template>
	<style>
		@font-face {
			font-family: 'Kit Poppins';
			font-weight: 800;
			src: url('assets/kit/fonts/poppins-800.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Inter';
			font-weight: 800;
			src: url('assets/kit/fonts/inter-800.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Inter';
			font-weight: 700;
			src: url('assets/kit/fonts/inter-700.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Emoji';
			src: local('Noto Color Emoji');
		}
		#root {
			position: absolute;
			inset: 0;
			overflow: hidden;
		}
		#s8-fond {
			position: absolute;
			inset: 0;
			background: radial-gradient(ellipse 90% 70% at 50% 30%, #2a1fa8 0%, #10106a 55%, #070824 100%);
		}
		.mot {
			position: absolute;
			left: 0;
			right: 0;
			text-align: center;
			font-family: 'Kit Poppins';
			font-weight: 800;
			line-height: 1;
			white-space: nowrap;
		}
		.emoji {
			position: absolute;
			font-family: 'Kit Emoji';
			line-height: 1;
		}
		.lettre {
			display: inline-block;
		}
	</style>
	<div id="root" data-composition-id="s8" data-width="1080" data-height="1920">
		<div id="s8-fond"></div>
		<svg style="position: absolute; width: 0; height: 0"><filter id="s8-flou" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="s8-flou-g" stdDeviation="0 0" /></filter></svg>
		<!-- Une affiche de produit : fond bleu nuit, traînées de lumière qui jaillissent du bas, étiquette « AFFICHES », gros titre serré, la basket qui arrive en grand. -->
		<div id="s8-camera" style="position: absolute; inset: 0; filter: url(#s8-flou)">
			<div id="s8-scene" style="position: absolute; inset: 0">
			<div id="s8-lumiere" style="position: absolute; left: -540px; top: 900px; width: 2160px; height: 2160px; border-radius: 50%; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 60, 200, 0.55) 0deg 2deg, rgba(80, 200, 255, 0.5) 2deg 4deg, rgba(255, 200, 60, 0.45) 4deg 5deg, transparent 5deg 9deg); -webkit-mask-image: radial-gradient(circle, transparent 18%, #000 40%, transparent 72%); mask-image: radial-gradient(circle, transparent 18%, #000 40%, transparent 72%); filter: blur(3px)"></div>
			<div id="s8-tag" style="position: absolute; left: 110px; top: 250px; padding: 14px 28px; border-radius: 14px; background: #ffffff; font-family: 'Kit Inter'; font-weight: 800; font-size: 34px; letter-spacing: 10px; color: #2a1fa8">AFFICHES</div>
			<div class="mot s8-l" style="left: 104px; right: auto; top: 350px; font-size: 118px; color: #ffffff; text-align: left; letter-spacing: -4px; text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4)">VOTRE PRODUIT</div>
			<div class="mot s8-l" style="left: 104px; right: auto; top: 470px; font-size: 118px; color: #ffffff; text-align: left; letter-spacing: -4px; text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4)">EN GRAND,</div>
			<div class="mot s8-l" style="left: 104px; right: auto; top: 590px; font-size: 118px; color: #ffffff; text-align: left; letter-spacing: -4px; text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4)">PARTOUT.</div>
			<div id="s8-ligne" style="position: absolute; left: 110px; top: 750px; font-family: 'Kit Inter'; font-weight: 800; font-size: 30px; letter-spacing: 8px; color: #c9cbff">GIRESSE <span style="color: #6f74ff">|</span> DIGITAL STUDIO</div>
			<div id="s8-produit" class="emoji" style="left: 360px; top: 840px; font-size: 380px; filter: drop-shadow(0 40px 60px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 40px rgba(120, 160, 255, 0.5))">👟</div>
			</div>
		</div>
	</div>
	<script>
		(function () {
			const tl = gsap.timeline({paused: true});
			// Arrivée en coup de fouet : flou de mouvement qui se dissipe sur une longue traîne.
			const fouet = (cible, t, {dx = 0, dy = 0, echelle = 1, duree = 0.45, flou = 18} = {}) =>
				tl.fromTo(cible, {opacity: 0, x: dx, y: dy, scale: echelle, filter: `blur(${flou}px)`}, {opacity: 1, x: 0, y: 0, scale: 1, filter: 'blur(0px)', duration: duree, ease: 'expo.out'}, t);
			// Sortie : accélère et se floute, plus courte que l'arrivée.
			const part = (cible, t, {dx = 0, dy = 0, duree = 0.2} = {}) =>
				tl.to(cible, {opacity: 0, x: dx, y: dy, filter: 'blur(16px)', duration: duree, ease: 'power3.in'}, t);
			// Caméra : la scène tourne et glisse lentement pendant toute sa durée (le décor reste derrière).
			const camera = (de, a) => tl.fromTo('#s8-scene', {...de, transformPerspective: 1700}, {...a, transformPerspective: 1700, duration: 1.67 + 0.2, ease: 'sine.inOut'}, 0);
			// Coup de fouet sur toute l'image, avec un flou de mouvement dans le sens du mouvement.
			const sens = {gauche: ['x', -1], droite: ['x', 1], haut: ['y', -1], bas: ['y', 1]};
			const flou = (axe, v) => (axe === 'x' ? `${v} 0` : `0 ${v}`);
			const fouetEntree = (dir, t = 0) => {
				const [axe, d] = sens[dir];
				tl.fromTo('#s8-camera', {[axe]: -d * 900}, {[axe]: 0, duration: 0.34, ease: 'expo.out'}, t);
				tl.fromTo('#s8-flou-g', {attr: {stdDeviation: flou(axe, 70)}}, {attr: {stdDeviation: flou(axe, 0)}, duration: 0.3, ease: 'power2.out'}, t);
			};
			const fouetSortie = (dir, t) => {
				const [axe, d] = sens[dir];
				tl.to('#s8-camera', {[axe]: d * 900, duration: 0.2, ease: 'power3.in'}, t);
				tl.fromTo('#s8-flou-g', {attr: {stdDeviation: flou(axe, 0)}}, {attr: {stdDeviation: flou(axe, 70)}, duration: 0.2, ease: 'power3.in', immediateRender: false}, t);
			};
			// Lettres une par une, qui basculent en 3D et rebondissent (le texte est découpé en lettres).
			const decouper = (el) => {
				[...el.childNodes].forEach((nd) => {
					if (nd.nodeType === 3) {
						const frag = document.createDocumentFragment();
						[...nd.textContent].forEach((c) => {
							const sp = document.createElement('span');
							sp.className = 'lettre';
							sp.textContent = c === ' ' ? ' ' : c;
							frag.appendChild(sp);
						});
						el.replaceChild(frag, nd);
					} else if (nd.nodeType === 1 && nd.tagName !== 'BR') decouper(nd);
				});
			};
			const lettres = (sel, t, {ecart = 0.035, de = {opacity: 0, y: -110, rotationX: -90, scale: 0.4}, duree = 0.42, ease = 'back.out(2.2)'} = {}) => {
				document.querySelectorAll(sel).forEach(decouper);
				const spans = document.querySelectorAll(sel.split(',').map((x) => `${x.trim()} .lettre`).join(', '));
				tl.fromTo(spans, {...de, transformPerspective: 700}, {opacity: 1, x: 0, y: 0, rotationX: 0, rotationY: 0, scale: 1, transformPerspective: 700, duration: duree, ease, stagger: ecart}, t);
			};

			camera({rotationY: -10, x: 60, scale: 1.08}, {rotationY: 6, x: -60, scale: 1.0});
			fouetEntree('gauche');
			fouetSortie('bas', 1.47);
			tl.fromTo('#s8-lumiere', {scale: 0.7, rotation: -6, opacity: 0}, {scale: 1.15, rotation: 6, opacity: 1, duration: 1.6, ease: 'power2.out'}, 0);
			fouet('#s8-tag', 0, {dx: -100, flou: 10, duree: 0.35});
			lettres('.s8-l', 0.05, {ecart: 0.018, de: {opacity: 0, x: -80, y: 0, rotationX: 0, rotationY: 70, scale: 1}, ease: 'expo.out', duree: 0.35});
			fouet('#s8-ligne', 0.35, {dx: -60, flou: 8, duree: 0.35});
			tl.fromTo('#s8-produit', {opacity: 0, x: 500, rotation: 25, filter: 'blur(18px)'}, {opacity: 1, x: 0, rotation: -8, filter: 'blur(0px)', duration: 0.55, ease: 'expo.out'}, 0.25);
			window.__timelines = window.__timelines || {};
			window.__timelines['s8'] = tl;
		})();
	</script>
</template>
