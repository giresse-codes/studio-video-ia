<template>
	<style>
		@font-face {
			font-family: 'Kit Poppins';
			font-weight: 800;
			src: url('assets/kit/fonts/poppins-800.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Inter';
			font-weight: 800;
			src: url('assets/kit/fonts/inter-800.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Inter';
			font-weight: 700;
			src: url('assets/kit/fonts/inter-700.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Emoji';
			src: local('Noto Color Emoji');
		}
		#root {
			position: absolute;
			inset: 0;
			overflow: hidden;
		}
		#s1-fond {
			position: absolute;
			inset: 0;
			background: radial-gradient(ellipse 80% 60% at 50% 45%, #1d5f9e 0%, #0b3a66 55%, #061f38 100%);
		}
		.mot {
			position: absolute;
			left: 0;
			right: 0;
			text-align: center;
			font-family: 'Kit Poppins';
			font-weight: 800;
			line-height: 1;
			white-space: nowrap;
		}
		.emoji {
			position: absolute;
			font-family: 'Kit Emoji';
			line-height: 1;
		}
		.lettre {
			display: inline-block;
		}
		.s1-face {
			position: absolute;
			left: 0;
			top: 0;
			width: 600px;
			height: 420px;
			border-radius: 40px;
			background: linear-gradient(160deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.06) 100%);
			border: 3px solid rgba(255, 255, 255, 0.35);
			box-shadow: inset 0 0 60px rgba(124, 200, 255, 0.25);
			backface-visibility: hidden;
		}
	</style>
	<div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
		<div id="s1-fond"></div>
		<svg style="position: absolute; width: 0; height: 0"><filter id="s1-flou" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="s1-flou-g" stdDeviation="0 0" /></filter></svg>
		<!-- Un cube de verre qui tourne : « UN PROJET » sur une face, « EN TÊTE ? » sur l'autre ; les trois services flottent au-dessus. -->
		<div id="s1-camera" style="position: absolute; inset: 0; filter: url(#s1-flou)">
			<div id="s1-scene" style="position: absolute; inset: 0">
			<div style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1600px">
				<div id="s1-cube" data-layout-allow-overlap style="position: absolute; left: 240px; top: 620px; width: 600px; height: 420px; transform-style: preserve-3d">
					<div class="s1-face" style="transform: translateZ(210px)">
						<div class="mot" style="top: 120px; font-size: 118px; color: #ffffff; text-shadow: 0 1px 0 #0a3157, 0 2px 0 #0a3157, 0 3px 0 #0a3157, 0 4px 0 #0a3157, 0 5px 0 #0a3157, 0 6px 0 #0a3157, 0 7px 0 #0a3157, 0 8px 0 #0a3157, 0 9px 0 #0a3157, 0 10px 0 #0a3157, 0 11px 0 #0a3157, 0 12px 0 #0a3157, 0 26px 34px rgba(0, 0, 0, 0.35)">UN PROJET</div>
					</div>
					<div class="s1-face" style="transform: rotateY(90deg) translateZ(390px); width: 420px; left: 90px">
						<div class="mot" style="top: 140px; font-size: 92px; color: #ffffff; text-shadow: 0 1px 0 #0a3157, 0 2px 0 #0a3157, 0 3px 0 #0a3157, 0 4px 0 #0a3157, 0 5px 0 #0a3157, 0 6px 0 #0a3157, 0 7px 0 #0a3157, 0 8px 0 #0a3157, 0 9px 0 #0a3157, 0 10px 0 #0a3157, 0 11px 0 #0a3157, 0 12px 0 #0a3157, 0 26px 34px rgba(0, 0, 0, 0.35)">EN TÊTE ?</div>
					</div>
				</div>
			</div>
			<div id="s1-i1" class="emoji" style="left: 300px; top: 420px; font-size: 130px">🎬</div>
			<div id="s1-i2" class="emoji" style="left: 475px; top: 380px; font-size: 130px">🌐</div>
			<div id="s1-i3" class="emoji" style="left: 650px; top: 420px; font-size: 130px">📱</div>
			</div>
		</div>
	</div>
	<script>
		(function () {
			const tl = gsap.timeline({paused: true});
			// Arrivée en coup de fouet : flou de mouvement qui se dissipe sur une longue traîne.
			const fouet = (cible, t, {dx = 0, dy = 0, echelle = 1, duree = 0.45, flou = 18} = {}) =>
				tl.fromTo(cible, {opacity: 0, x: dx, y: dy, scale: echelle, filter: `blur(${flou}px)`}, {opacity: 1, x: 0, y: 0, scale: 1, filter: 'blur(0px)', duration: duree, ease: 'expo.out'}, t);
			// Sortie : accélère et se floute, plus courte que l'arrivée.
			const part = (cible, t, {dx = 0, dy = 0, duree = 0.2} = {}) =>
				tl.to(cible, {opacity: 0, x: dx, y: dy, filter: 'blur(16px)', duration: duree, ease: 'power3.in'}, t);
			// Caméra : la scène tourne et glisse lentement pendant toute sa durée (le décor reste derrière).
			const camera = (de, a) => tl.fromTo('#s1-scene', {...de, transformPerspective: 1700}, {...a, transformPerspective: 1700, duration: 1.86 + 0.2, ease: 'sine.inOut'}, 0);
			// Coup de fouet sur toute l'image, avec un flou de mouvement dans le sens du mouvement.
			const sens = {gauche: ['x', -1], droite: ['x', 1], haut: ['y', -1], bas: ['y', 1]};
			const flou = (axe, v) => (axe === 'x' ? `${v} 0` : `0 ${v}`);
			const fouetEntree = (dir, t = 0) => {
				const [axe, d] = sens[dir];
				tl.fromTo('#s1-camera', {[axe]: -d * 900}, {[axe]: 0, duration: 0.34, ease: 'expo.out'}, t);
				tl.fromTo('#s1-flou-g', {attr: {stdDeviation: flou(axe, 70)}}, {attr: {stdDeviation: flou(axe, 0)}, duration: 0.3, ease: 'power2.out'}, t);
			};
			const fouetSortie = (dir, t) => {
				const [axe, d] = sens[dir];
				tl.to('#s1-camera', {[axe]: d * 900, duration: 0.2, ease: 'power3.in'}, t);
				tl.fromTo('#s1-flou-g', {attr: {stdDeviation: flou(axe, 0)}}, {attr: {stdDeviation: flou(axe, 70)}, duration: 0.2, ease: 'power3.in', immediateRender: false}, t);
			};
			// Lettres une par une, qui basculent en 3D et rebondissent (le texte est découpé en lettres).
			const decouper = (el) => {
				[...el.childNodes].forEach((nd) => {
					if (nd.nodeType === 3) {
						const frag = document.createDocumentFragment();
						[...nd.textContent].forEach((c) => {
							const sp = document.createElement('span');
							sp.className = 'lettre';
							sp.textContent = c === ' ' ? ' ' : c;
							frag.appendChild(sp);
						});
						el.replaceChild(frag, nd);
					} else if (nd.nodeType === 1 && nd.tagName !== 'BR') decouper(nd);
				});
			};
			const lettres = (sel, t, {ecart = 0.035, de = {opacity: 0, y: -110, rotationX: -90, scale: 0.4}, duree = 0.42, ease = 'back.out(2.2)'} = {}) => {
				document.querySelectorAll(sel).forEach(decouper);
				const spans = document.querySelectorAll(sel.split(',').map((x) => `${x.trim()} .lettre`).join(', '));
				tl.fromTo(spans, {...de, transformPerspective: 700}, {opacity: 1, x: 0, y: 0, rotationX: 0, rotationY: 0, scale: 1, transformPerspective: 700, duration: duree, ease, stagger: ecart}, t);
			};

			camera({rotationY: -9, rotationX: 4, scale: 1.08, x: 40}, {rotationY: 7, rotationX: -2, scale: 1.0, x: -40});
			fouetSortie('gauche', 1.66);
			// Image 0 : le cube est déjà là ; il tourne pour montrer « EN TÊTE ? ».
			tl.fromTo('#s1-cube', {rotationY: 18, rotationX: -8}, {rotationY: -62, rotationX: 6, duration: 1.7, ease: 'power2.inOut'}, 0);
			lettres('.s1-face .mot', 0.02, {ecart: 0.04});
			fouet('#s1-i1', 0.15, {dy: 80, echelle: 0.4});
			fouet('#s1-i2', 0.27, {dy: 80, echelle: 0.4});
			fouet('#s1-i3', 0.39, {dy: 80, echelle: 0.4});
			tl.to(['#s1-i1', '#s1-i2', '#s1-i3'], {y: -24, duration: 0.6, ease: 'sine.inOut', stagger: 0.1}, 0.8);
			// Coupe : tout file à gauche, flou.
			window.__timelines = window.__timelines || {};
			window.__timelines['s1'] = tl;
		})();
	</script>
</template>
