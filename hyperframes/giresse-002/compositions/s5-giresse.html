<template>
	<style>
		@font-face {
			font-family: 'Kit Poppins';
			font-weight: 800;
			src: url('assets/kit/fonts/poppins-800.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Inter';
			font-weight: 800;
			src: url('assets/kit/fonts/inter-800.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Inter';
			font-weight: 700;
			src: url('assets/kit/fonts/inter-700.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Kit Emoji';
			src: local('Noto Color Emoji');
		}
		#root {
			position: absolute;
			inset: 0;
			overflow: hidden;
		}
		#s5-fond {
			position: absolute;
			inset: 0;
			background: radial-gradient(ellipse 90% 70% at 50% 40%, #5a1fd1 0%, #3b0a8f 55%, #1b0450 100%);
		}
		.mot {
			position: absolute;
			left: 0;
			right: 0;
			text-align: center;
			font-family: 'Kit Poppins';
			font-weight: 800;
			line-height: 1;
			white-space: nowrap;
		}
		.emoji {
			position: absolute;
			font-family: 'Kit Emoji';
			line-height: 1;
		}
		.lettre {
			display: inline-block;
		}
		.s5-lame {
			position: absolute;
			width: 760px;
			height: 120px;
			border-radius: 12px;
			box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
		}
	</style>
	<div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
		<div id="s5-fond"></div>
		<svg style="position: absolute; width: 0; height: 0"><filter id="s5-flou" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="s5-flou-g" stdDeviation="0 0" /></filter></svg>
		<!-- Fond violet : des lames de couleur filent en perspective, un trait cyan tombe ; « NOUS, C'EST » puis la carte du logo GIRESSE. -->
		<div id="s5-camera" style="position: absolute; inset: 0; filter: url(#s5-flou)">
			<div id="s5-scene" style="position: absolute; inset: 0">
			<div style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1200px">
				<div class="s5-lame" style="left: -120px; top: 360px; background: linear-gradient(90deg, #ff3ea5, #ff7ac6); transform: rotateY(-28deg)"></div>
				<div class="s5-lame" style="left: 520px; top: 1330px; background: linear-gradient(90deg, #ffd23f, #fff07a); transform: rotateY(24deg)"></div>
				<div class="s5-lame" style="left: -80px; top: 1460px; background: linear-gradient(90deg, #3dff9a, #b5ff6b); transform: rotateY(-20deg)"></div>
			</div>
			<div id="s5-laser" style="position: absolute; left: 860px; top: 0; width: 10px; height: 1920px; background: #3ff4ff; box-shadow: 0 0 30px #3ff4ff"></div>
			<div class="mot" id="s5-nous" style="top: 330px; font-size: 130px; color: #ffffff; text-shadow: 0 1px 0 #2a0870, 0 2px 0 #2a0870, 0 3px 0 #2a0870, 0 4px 0 #2a0870, 0 5px 0 #2a0870, 0 6px 0 #2a0870, 0 7px 0 #2a0870, 0 8px 0 #2a0870, 0 9px 0 #2a0870, 0 10px 0 #2a0870, 0 11px 0 #2a0870, 0 12px 0 #2a0870, 0 26px 34px rgba(0, 0, 0, 0.35)">NOUS, C'EST</div>
			<div id="s5-carte" style="position: absolute; left: 190px; top: 560px; width: 700px; height: 700px; border-radius: 60px; background: linear-gradient(170deg, #f6f4ef 0%, #e9e6df 100%); box-shadow: 0 60px 120px rgba(10, 0, 40, 0.5)">
				<img src="assets/marque/logo-complet.png" style="position: absolute; left: 115px; top: 70px; width: 470px" />
			</div>
			</div>
		</div>
	</div>
	<script>
		(function () {
			const tl = gsap.timeline({paused: true});
			// Arrivée en coup de fouet : flou de mouvement qui se dissipe sur une longue traîne.
			const fouet = (cible, t, {dx = 0, dy = 0, echelle = 1, duree = 0.45, flou = 18} = {}) =>
				tl.fromTo(cible, {opacity: 0, x: dx, y: dy, scale: echelle, filter: `blur(${flou}px)`}, {opacity: 1, x: 0, y: 0, scale: 1, filter: 'blur(0px)', duration: duree, ease: 'expo.out'}, t);
			// Sortie : accélère et se floute, plus courte que l'arrivée.
			const part = (cible, t, {dx = 0, dy = 0, duree = 0.2} = {}) =>
				tl.to(cible, {opacity: 0, x: dx, y: dy, filter: 'blur(16px)', duration: duree, ease: 'power3.in'}, t);
			// Caméra : la scène tourne et glisse lentement pendant toute sa durée (le décor reste derrière).
			const camera = (de, a) => tl.fromTo('#s5-scene', {...de, transformPerspective: 1700}, {...a, transformPerspective: 1700, duration: 1.5 + 0.2, ease: 'sine.inOut'}, 0);
			// Coup de fouet sur toute l'image, avec un flou de mouvement dans le sens du mouvement.
			const sens = {gauche: ['x', -1], droite: ['x', 1], haut: ['y', -1], bas: ['y', 1]};
			const flou = (axe, v) => (axe === 'x' ? `${v} 0` : `0 ${v}`);
			const fouetEntree = (dir, t = 0) => {
				const [axe, d] = sens[dir];
				tl.fromTo('#s5-camera', {[axe]: -d * 900}, {[axe]: 0, duration: 0.34, ease: 'expo.out'}, t);
				tl.fromTo('#s5-flou-g', {attr: {stdDeviation: flou(axe, 70)}}, {attr: {stdDeviation: flou(axe, 0)}, duration: 0.3, ease: 'power2.out'}, t);
			};
			const fouetSortie = (dir, t) => {
				const [axe, d] = sens[dir];
				tl.to('#s5-camera', {[axe]: d * 900, duration: 0.2, ease: 'power3.in'}, t);
				tl.fromTo('#s5-flou-g', {attr: {stdDeviation: flou(axe, 0)}}, {attr: {stdDeviation: flou(axe, 70)}, duration: 0.2, ease: 'power3.in', immediateRender: false}, t);
			};
			// Lettres une par une, qui basculent en 3D et rebondissent (le texte est découpé en lettres).
			const decouper = (el) => {
				[...el.childNodes].forEach((nd) => {
					if (nd.nodeType === 3) {
						const frag = document.createDocumentFragment();
						[...nd.textContent].forEach((c) => {
							const sp = document.createElement('span');
							sp.className = 'lettre';
							sp.textContent = c === ' ' ? ' ' : c;
							frag.appendChild(sp);
						});
						el.replaceChild(frag, nd);
					} else if (nd.nodeType === 1 && nd.tagName !== 'BR') decouper(nd);
				});
			};
			const lettres = (sel, t, {ecart = 0.035, de = {opacity: 0, y: -110, rotationX: -90, scale: 0.4}, duree = 0.42, ease = 'back.out(2.2)'} = {}) => {
				document.querySelectorAll(sel).forEach(decouper);
				const spans = document.querySelectorAll(sel.split(',').map((x) => `${x.trim()} .lettre`).join(', '));
				tl.fromTo(spans, {...de, transformPerspective: 700}, {opacity: 1, x: 0, y: 0, rotationX: 0, rotationY: 0, scale: 1, transformPerspective: 700, duration: duree, ease, stagger: ecart}, t);
			};

			camera({rotationY: -14, x: 80, scale: 1.1}, {rotationY: 10, x: -80, scale: 1.0});
			fouetEntree('haut');
			fouetSortie('gauche', 1.3);
			// Les lames filent, le trait cyan tombe ; « NOUS, C'EST » ; la carte du logo pivote et se pose.
			tl.fromTo('.s5-lame', {x: -900, filter: 'blur(20px)'}, {x: 0, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out', stagger: 0.08}, 0);
			tl.fromTo('#s5-laser', {scaleY: 0, transformOrigin: '50% 0%'}, {scaleY: 1, duration: 0.4, ease: 'power3.out'}, 0.1);
			lettres('#s5-nous', 0.05, {ecart: 0.03, de: {opacity: 0, x: 120, rotationY: -90, y: 0, rotationX: 0, scale: 0.8}});
			tl.fromTo('#s5-carte', {opacity: 0, rotationY: -60, rotationX: 15, scale: 0.7, filter: 'blur(18px)', transformPerspective: 1400}, {opacity: 1, rotationY: 0, rotationX: 0, scale: 1, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out'}, 0.35);
			tl.to('.s5-lame', {x: 120, duration: 0.9, ease: 'none'}, 0.6);
			window.__timelines = window.__timelines || {};
			window.__timelines['s5'] = tl;
		})();
	</script>
</template>
