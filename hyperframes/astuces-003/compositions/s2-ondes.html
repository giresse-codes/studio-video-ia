			const tl = S.tl;

			kit.pop(tl, '#s2-box', 0);
			// « ondes » : les cercles partent de la box, jusqu'à la fin de la scène.
			const ondes = S.ancre('@ondes');

			const faible = S.ancre('@affaiblissent');
			tl.to('#s2-ampoule', {opacity: 0, scale: 0.6, svgOrigin: '700 360', duration: 0.3}, faible - 0.1);
			kit.cascade(tl, '.s2-mur', faible, 0.3);
			kit.cascade(tl, '.s2-barres', faible + 0.15, 0.3);
			S.zoomMot('@mur', [640, 760]);
