	<script>
		(function () {
			const S = kit.scene('s2');
			const tl = S.tl;

			// Début : l'ordinateur et son bouton « à tous ».
			kit.pop(tl, '#s2-ordi', 0.1);
			kit.pop(tl, '#s2-envoyer', 0.25);
			// « envoie » : le bouton s'enfonce, les SMS s'envolent.
			const envoie = S.ancre('@envoie');
			tl.to('#s2-envoyer', {y: 10, duration: 0.08, yoyo: true, repeat: 1}, envoie);
			tl.fromTo('.s2-vol', {x: 0, y: 0, opacity: 0}, {keyframes: [{opacity: 1, duration: 0.05}, {x: (i) => [150, 310, 470][i], y: (i) => [-90, 130, -90][i], duration: 0.6, ease: 'power2.out'}, {opacity: 0, duration: 0.15}], stagger: 0.12}, envoie);
			// « message » : le même SMS arrive partout, la grille se remplit (zoom).
			kit.cascade(tl, '.s2-tel', S.ancre('@message'), 0.08);
			S.zoomMot('@message', [700, 480]);
			// « numéros » : le compteur grimpe jusqu'à 10 000.
			const compteur = document.querySelector('#s2-compteur');
			const n = {v: 0};
			kit.pop(tl, '#s2-compteur', S.ancre('@numeros'));
			tl.fromTo(n, {v: 0}, {v: 10000, duration: 1.2, ease: 'power2.out', onUpdate: () => (compteur.textContent = Math.round(n.v).toLocaleString('fr-FR'))}, S.ancre('@numeros'));
			// « attendes » : un des téléphones s'allume en vert ; « colis » : c'est le bon moment pour l'arnaqueur.
			tl.to('#s2-halo', {opacity: 1, duration: 0.2}, S.ancre('@attendes'));
			kit.tampon(tl, '#s2-attend', S.ancre('@attendes'));
			kit.pop(tl, '#s2-colis', S.ancre('@colis'));

			S.fin();
		})();
	</script>
