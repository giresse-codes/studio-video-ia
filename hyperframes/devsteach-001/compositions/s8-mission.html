			const tl = S.tl;

			// « ordinateur » : le portable arrive ; « clic droit » : le curseur clique, le menu s'ouvre.

			kit.pop(tl, '#s8-menu', S.ancre('@droit'));

			// « Inspecter » : l'élément s'allume, le code apparaît (style « Écran code »).
			tl.fromTo('#s8-inspecter', {backgroundColor: '#ffffff', color: '#141414'}, {backgroundColor: '#2eb82e', color: '#ffffff', duration: 0.15}, S.ancre('@inspecter'));
			tl.fromTo('#s8-code', {opacity: 0, y: 80}, {opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.8)'}, S.ancre('@inspecter') + 0.3);
			S.zoomMot('@inspecter', [460, 560]);

			// « téléphone » : le téléphone arrive ; « view-source: » s'écrit devant l'adresse.
			kit.chute(tl, '#s8-telephone', S.ancre('@telephone'), {hauteur: 400});
			tl.to('#s8-menu', {opacity: 0, duration: 0.2}, S.ancre('@telephone'));
			kit.frappe(tl, '#s8-url', 'view-source:\nmonsite.fr', S.ancre('@viewsource'), 0.8);
			kit.trace(tl, '.s8-ligne', S.ancre('@adresse'), 0.4);

			S.fin();
		})();
