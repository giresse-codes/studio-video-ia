		(function () {
			const S = kit.scene('s5');
			const tl = S.tl;
			document.querySelectorAll('.s5-etoile').forEach((e, i) => kit.boucle(tl, e, {opacity: 0.2}, S.ancre('@etape') + i * 0.3, S.dur, 1.2 + i * 0.2));

			// « part » : le ticket de commande file le long du trajet vers le serveur.

			tl.to('#s5-ticket', {x: 260, y: -330, scale: 0.4, opacity: 0, duration: 0.6, ease: 'power2.in'}, S.ancre('@part') + 0.3);

			// « serveur » : l'ordinateur-pizzeria arrive, gros chiffre 3, « ouvert 24h/24 ».

			S.zoomMot('@serveur', [500, 640]);
			kit.tampon(tl, '#s5-ouvert', S.ancre('@ordinateur'));

			// « allumé » : la lumière du serveur clignote, toujours allumée.
			kit.boucle(tl, '#s5-led', {opacity: 0.3}, S.ancre('@allume'), S.dur, 0.6);

			// « pizzeria » : store rayé, four qui s'allume, toque de chef (gag).

			kit.trace(tl, '#s5-barre', S.ancre('@jamais'), 0.25, 'power2.out');

			S.fin();
