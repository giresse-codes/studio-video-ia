		<script>
			(function () {
				const tl = gsap.timeline({paused: true});
				// Grain qui change 12 fois par seconde, graine tirée du temps (rendu identique à chaque fois).
				const bruit = document.getElementById('grain-bruit');
				const horloge = {t: 0};
				tl.fromTo(horloge, {t: 0}, {t: 52.271, duration: 52.271, ease: 'none', onUpdate: () => bruit.setAttribute('seed', 1 + (Math.floor(horloge.t * 12) % 97))}, 0);
				window.__timelines = window.__timelines || {};
				window.__timelines['main'] = tl;
			})();
		</script>
